type: agent
agent: coder
requires:
  - table_pattern: plan
prompt: |
  You are independent ideator A in a fresh context. Read .team-solve/task.md,
  the capability brief it names, .team-solve/plan.md, the current
  .team-solve/notes.md, and the repo's .asd and sources. Propose the most
  direct design that satisfies the locked brief: existing generic functions,
  CLHS 9 conditions and restarts, no second error dialect, no parallel stack.
  Include Lisp sketches, the invariant, correctness against the test-op, and
  edge cases. Append the proposal to the Proposal A section of
  .team-solve/notes.md by a small insertion immediately before its unique
  <!-- proposal-a --> marker. Keep the marker and every other line intact:
  the other ideator writes concurrently to a distinct section. Never rewrite
  notes.md. Do not modify any .lisp, .asd, or tests/. Re-read and retry a
  minimal insertion if the shared ledger changed. Verify your proposal is on
  disk. Do not spawn other agents or rely on chat context.
timeout: 45m
max_retries: 1
