type: agent
agent: coder
requires:
  - table_pattern: plan
prompt: |
  You are independent ideator B in a fresh context. Read .team-solve/task.md,
  the capability brief it names, .team-solve/plan.md, the current
  .team-solve/notes.md, and the repo's .asd and sources. Propose one concrete
  alternative from a different family than the obvious one (if the obvious
  approach is a new protocol generic, try a backend method, composing a system
  the stack already has, or a different representation). It must still obey
  the locked brief. Compare tradeoffs with the obvious approach. Include Lisp
  sketches, correctness against the test-op, and condition or restart edges.
  Append the proposal to the Proposal B section of .team-solve/notes.md by a
  small insertion immediately before its unique <!-- proposal-b --> marker.
  Keep the marker and all other lines intact: the other ideator writes
  concurrently to a distinct section. Never rewrite notes.md. Do not modify
  any .lisp, .asd, or tests/. Re-read and retry a minimal insertion if the
  shared ledger changed. Verify your proposal is on disk. Do not spawn other
  agents or rely on chat context.
timeout: 45m
max_retries: 1
