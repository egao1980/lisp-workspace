type: agent
agent: coder
prompt: |
  You are the planner in a ledger-based team with fresh contexts. Read
  .team-solve/task.md and the capability brief named by its brief field.
  The checkout is a cl-stack Common Lisp feature: CLOS protocol and backends,
  conditions and restarts, the existing ASDF test-op. Write .team-solve/plan.md
  with the decomposition, which files may change, which files are read-only
  (tests/, task.md, the brief), the locked decisions you must not reopen,
  two or three candidate designs and which layer each sits in (protocol,
  backend, or facade), and instructions for independent ideators, the solver,
  and the reviewer. Do not implement. Do not edit task.md, tests/, the brief,
  or any .lisp or .asd. Initialize .team-solve/notes.md for THIS run, with a
  title, the run identifier {{.partition}}, and separate headings for
  Proposal A, Proposal B, Solver decision, Review, and Repair. Include unique
  literal markers <!-- proposal-a --> and <!-- proposal-b --> under their
  headings. Reserve enough blank lines in these sections that notes.md is at
  least 50 lines long. Parallel workers will insert at distinct markers using
  small patches, never overwrite the ledger. Verify both files exist and that
  both markers occur exactly once. Communicate only through these on-disk
  files; do not rely on prior conversation or delegate agents yourself.
timeout: 45m
max_retries: 1
