type: agent
agent: coder
requires:
  - table_pattern: test
prompt: |
  You are the manager/reviewer in a fresh context. Read .team-solve/task.md,
  .team-solve/notes.md, the implementation, .team-solve/test-status.txt, and
  .team-solve/test-output.log. Inspect the captured test-op output, not a
  previous agent's claims. Write .team-solve/review.md and append the review
  to notes.md. If the status is nonzero, quote the failing tests and append
  concrete repair instructions to notes.md. Do not invent inputs or expected
  values that the log does not show. Do not edit Lisp or tests/ yourself.
  If the status is zero, record that no repair is needed. Do not alter the
  brief or bypass a contract-hash failure. Verify the review is on disk.
  There is exactly one repair round followed by a mandatory test-op; do not
  claim overall completion before that command passes.
timeout: 45m
max_retries: 1
