type: agent
agent: coder
requires:
  - table_pattern: ideate-a
  - table_pattern: ideate-b
prompt: |
  You are the solver in a fresh context. Read .team-solve/task.md, the
  capability brief, .team-solve/plan.md, and .team-solve/notes.md, including
  both proposals. Select and justify one approach in the Solver decision
  section of notes.md. Implement it in this checkout's Lisp sources, matching
  the repo's packages and .asd. Read the workspace asdf, cl-unit-testing, and
  cl-stack-conditions skills before editing. Signal conditions; do not invent
  a status-code API. Do not edit tests/, task.md, or the brief, and do not
  skip or weaken assertions. Do not create a second repo or a workspace-only
  tree. The downstream command runs the ASDF test-op and the manager owns the
  one repair round. Do not spawn agents or use chat context.
timeout: 45m
max_retries: 1
