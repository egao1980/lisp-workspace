type: command
requires:
  - table_pattern: repair
command: |
  if [ -z "${CHECK:-}" ] || [ ! -f "$CHECK" ]; then
    printf 'FAIL: set CHECK to check-feature.sh\n' >&2
    exit 1
  fi
  bash "$CHECK" > .team-solve/final-test-output.log 2>&1
  result=$?
  cat .team-solve/final-test-output.log
  exit "$result"
timeout: 30m
max_retries: 0
